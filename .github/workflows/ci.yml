name: Paper 01 Release Gate

on:
  pull_request:
    branches: [main, develop]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11.15"
  UV_VERSION: "0.11.29"

jobs:
  required-gates:
    name: Required gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install pinned Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Verify lock and clean sync
        shell: pwsh
        run: |
          uv lock --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --frozen --extra dev
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate repository scope
        run: uv run --frozen python tools/validate_repository_scope.py

      - name: Run unit tests
        run: uv run --frozen pytest -q

      - name: Replay Paper 01 release gate
        run: uv run --frozen python papers/paper01-rasti/scripts/replay_release.py
